name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e packages/nico-contracts
      - run: python -m pip install -e packages/nico-domain
      - run: python -m pip install -e packages/nico-agent-core
      - run: python -m pip install -e packages/nico-application
      - run: python -m pip install -e packages/nico-adapters
      - run: python -m pip install -e packages/nico-storage
      - run: python -m pip install -e packages/nico-cli
      - run: python -m pip install -e packages/nico-web
      - run: python -m pip install -e packages/nico-app
      - run: python -m unittest discover -s packages/nico-contracts/tests -v
      - run: python -m unittest discover -s packages/nico-domain/tests -v
      - run: python -m unittest discover -s packages/nico-agent-core/tests -v
      - run: python -m unittest discover -s packages/nico-application/tests -v
      - run: python -m unittest discover -s packages/nico-adapters/tests -v
      - run: python -m unittest discover -s packages/nico-storage/tests -v
      - run: python -m unittest discover -s packages/nico-cli/tests -v
      - run: python -m unittest discover -s packages/nico-web/tests -v
      - run: python scripts/check_dependency_graph.py --require-all
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_wheels.py --all
      - run: python scripts/verify_wheel_install.py --all
