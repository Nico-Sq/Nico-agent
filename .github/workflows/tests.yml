name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e packages/nico-contracts
      - run: python -m pip install -e packages/nico-domain
      - run: python -m pip install -e packages/nico-application
      - run: python -m pip install -e .
      - run: python -m unittest discover -s packages/nico-contracts/tests -v
      - run: python -m unittest discover -s packages/nico-domain/tests -v
      - run: python -m unittest discover -s packages/nico-application/tests -v
      - run: python scripts/check_dependency_graph.py
      - run: python -m unittest discover -s tests -v
