[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nico-adapters"
version = "0.1.0"
description = "Model protocol adapters for Nico-agent"
requires-python = ">=3.11"
dependencies = ["nico-contracts==0.1.0", "nico-agent-core==0.1.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nico_adapters = ["py.typed"]
