[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nico-adapters"
version = "0.1.0"
description = "Model and channel adapters for Nico-agent"
requires-python = ">=3.11"
dependencies = ["nico-contracts==0.1.0", "nico-domain==0.1.0", "nico-agent-core==0.1.0", "nico-application==0.1.0", "httpx>=0.27", "jsonschema>=4.21,<5", "python-docx>=1.2,<2", "pypdf>=6.21.4,<7"]

[project.entry-points."nico_agent.tool_adapters"]
stdio_mcp = "nico_adapters.mcp:MCPServers"
trusted_local_plugins = "nico_adapters.plugins:LocalPlugins"

[project.entry-points."nico_agent.channels"]
console = "nico_adapters.console:ConsoleChannel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nico_adapters = ["py.typed"]
