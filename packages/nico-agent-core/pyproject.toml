[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nico-agent-core"
version = "0.1.0"
description = "Provider-independent agent execution core for Nico-agent"
requires-python = ">=3.11"
dependencies = ["nico-contracts==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nico_agent_core = ["py.typed"]
