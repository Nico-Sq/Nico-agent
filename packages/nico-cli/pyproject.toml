[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nico-cli"
version = "0.1.0"
description = "Command-line interface for Nico-agent application services"
requires-python = ">=3.11"
dependencies = ["nico-contracts==0.1.0", "nico-application==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nico_cli = ["py.typed"]
