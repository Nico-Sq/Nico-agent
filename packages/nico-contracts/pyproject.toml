[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nico-contracts"
version = "0.1.0"
description = "Stable cross-package contracts for Nico-agent"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nico_contracts = ["py.typed"]
