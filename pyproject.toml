[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nico-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["nico-contracts==0.1.0", "nico-agent-core==0.1.0", "nico-adapters==0.1.0", "nico-application==0.1.0", "nico-storage==0.1.0", "nico-cli==0.1.0", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "python-multipart>=0.0.9", "python-docx>=1.2,<2", "pypdf>=5.9,<7", "jsonschema>=4.21,<5"]

[tool.setuptools]
packages = ["career_agent", "career_agent.providers"]

[tool.setuptools.package-data]
career_agent = ["static/*", "skills/*.md"]
