[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nico-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "python-multipart>=0.0.9", "python-docx>=1.2,<2", "pypdf>=5.9,<7"]

[tool.setuptools]
packages = ["career_agent"]

[tool.setuptools.package-data]
career_agent = ["static/*", "skills/*.md"]
